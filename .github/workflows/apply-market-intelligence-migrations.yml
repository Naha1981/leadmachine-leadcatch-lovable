name: Apply Market Intelligence migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply Market Intelligence migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.LEAD_MACHINE_SUPABASE_DB_URL }}
        run: bun scripts/apply-market-intelligence-migrations.ts
